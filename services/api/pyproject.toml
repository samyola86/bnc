[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bnc-api"
version = "0.1.0"
description = "BNC modular newsroom API"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2", "Pillow>=11,<13",
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "redis>=5.2,<7", "celery[redis]>=5.4,<6",
  "httpx>=0.28,<1", "feedparser>=6.0.12,<7", "defusedxml>=0.7.1,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
