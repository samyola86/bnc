name: bnc-newsroom

x-api: &api
  build:
    context: ..
    dockerfile: services/api/Dockerfile
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bnc}:${POSTGRES_PASSWORD:-bnc_local}@postgres:5432/${POSTGRES_DB:-bnc}
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://minio:9000
  volumes:
    - ../services/api:/app

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bnc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bnc_local}
      POSTGRES_DB: ${POSTGRES_DB:-bnc}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    build:
      context: ..
      dockerfile: infrastructure/minio/Dockerfile
      target: server
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-bnc_local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-bnc_local_storage_password}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["media_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  media-init:
    build:
      context: ..
      dockerfile: infrastructure/minio/Dockerfile
      target: client
    depends_on:
      minio: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bnc_local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-bnc_local_storage_password}
      S3_BUCKET: ${S3_BUCKET:-bnc-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done;
        mc mb --ignore-existing "local/$$S3_BUCKET"

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *api
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *api
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=info"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  scheduler:
    <<: *api
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  dashboard:
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      INGESTION_API_TOKEN: ${INGESTION_API_TOKEN:?Set INGESTION_API_TOKEN in .env}
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ../apps/dashboard:/workspace/apps/dashboard
      - dashboard_next:/workspace/apps/dashboard/.next
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  media_data:
  dashboard_next:
