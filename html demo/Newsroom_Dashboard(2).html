</style></head><body><div class="layout"><aside><div class="brand">newsroom<i>●</i><div class="eyebrow" style="margin-top:9px">Bangladesh information network</div></div><div><div class="eyebrow" style="padding:0 14px 15px">Workspace</div><nav id="nav"></nav></div><div class="bottom"><span class="dot"></span> Demo workspace<br><br><span class="avatar">S</span> <span style="color:white;margin-left:8px">Sam · Editor</span></div></aside><main><header><input class="search" id="search" aria-label="Search stories" placeholder="Search headlines, tags, users…"><div class="header-right"><span class="demo">SAMPLE WORKSPACE</span><span class="avatar">S</span></div></header><div class="wrap"><div class="topline"><div><div class="eyebrow" style="margin-bottom:9px">Editorial workspace · Dhaka</div><h1 id="title"></h1><p id="subtitle"></p></div><button class="btn primary" id="new">+ Write story</button></div><div id="content"></div><footer>HTML demo · Fictional stories · RSS and publication are simulated · Changes stay in this browser when storage is available.</footer></div></main></div><div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="editheading"><div class="drawer" id="drawer"></div></div><div id="toast" class="toast" hidden role="status"></div><script>

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=[{id:1,title:'Metro service resumes after a morning disruption',category:'Dhaka Now',tags:['Metro','Transport'],users:['Sam'],type:'News bite',origin:'RSS',feed:'City updates',status:'Draft',body:'Metro service has resumed following a temporary interruption. This fictional sample demonstrates how an incoming RSS story can be edited before publication.',summary:'A sample metro service update.',source:'Fictional operator notice',image:'',caption:'',alt:''},{id:2,title:'Local startup announces a new investment round',category:'Business',tags:['Startups','Investment'],users:['Nadia'],type:'Article',origin:'RSS',feed:'Business wire',status:'Queued',body:'A fictional local startup has announced a new investment round.\n\nThis sample article illustrates a story imported from an RSS feed, edited by the newsroom, and placed in the publishing queue.',summary:'A fictional investment announcement.',source:'Fictional company announcement',image:'',caption:'',alt:''},{id:3,title:'A guide to discovering weekend events in Dhaka',category:'Dhaka Now',tags:['Events','Weekend'],users:['Sam','Nadia'],type:'Article',origin:'Manual',status:'Draft',body:'A sample guide to weekend events in Dhaka.\n\nAdd your reporting, venue details, and useful information here.',summary:'An original newsroom guide.',source:'Newsroom reporting',image:'',caption:'',alt:''},{id:4,title:'Weekend technology meetup opens registration',category:'Tech',tags:['Technology','Meetup'],users:['Rafi'],type:'News bite',origin:'RSS',feed:'Technology digest',status:'Draft',body:'A fictional technology meetup has opened registration. Confirm dates and venue information with the organizer before publishing.',summary:'A sample technology event brief.',source:'Fictional organizer notice',image:'',caption:'',alt:''}];
let stories=seed.map(s=>({...s,body:s.body.replace(/\\n/g,'\n')})),feeds=[{name:'City updates',url:''},{name:'Business wire',url:''},{name:'Technology digest',url:''}],collection={limit:30,interval:'30 minutes',language:'English',mode:'RSS + permitted websites',auto:false},connections={},view='Incoming Stories',feedFilter='All feeds',statusFilter='All',draft=null,previewing=false,returnFocus=null;
try{const saved=JSON.parse(localStorage.getItem('newsroom-simple-v2'));if(saved){stories=saved.stories;feeds=saved.feeds;collection={...collection,...saved.collection};connections=saved.connections||{}}}catch{}
function persist(){try{localStorage.setItem('newsroom-simple-v2',JSON.stringify({stories,feeds,collection,connections}));return true}catch{toast('Saved for this session; browser storage unavailable or full.');return false}}
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').hidden=true,3500)}

function render(){const names=['Sources','Incoming Stories','Manual Writing','Publishing','Published','Connections'];$('nav').innerHTML=names.map((n,i)=>`<button data-view="${n}" class="${n===view?'active':''}"><span>${['◈','↓','✎','↗','▤','⚙'][i]}</span>${n}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;statusFilter='All';render()});$('title').textContent=view;$('subtitle').textContent={'Sources':'Choose where stories come from and how often to collect them.','Incoming Stories':'Review collected candidates, discard items, and edit drafts.','Manual Writing':'Write original articles and short news bites.','Publishing':'Preview destinations, publish now, or schedule your stories.','Published':'Review delivery history, retry failed channels, and make corrections.','Connections':'Configure your website, social accounts, and AI integration.'}[view];
if(view==='Sources'){renderSources();return}if(view==='Connections'){renderConnections();return}
let rows=stories.filter(s=>view==='Incoming Stories'?s.origin==='RSS'&&s.status==='Draft':view==='Manual Writing'?s.origin==='Manual'&&s.status==='Draft':view==='Published'?s.status==='Published':['Queued','Scheduled'].includes(s.status));const q=$('search').value.toLowerCase();rows=rows.filter(s=>[s.title,s.category,...s.tags,...s.users].join(' ').toLowerCase().includes(q));if(view==='Incoming Stories'&&feedFilter!=='All feeds')rows=rows.filter(s=>s.feed===feedFilter);if(statusFilter!=='All')rows=rows.filter(s=>s.status===statusFilter);
$('content').innerHTML=`${view==='Incoming Stories'?'<div class="notice" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap"><span>Collect up to '+collection.limit+' stories per batch · '+esc(collection.interval)+' · '+esc(collection.language)+' drafts. Manage these settings in Sources.</span><button class="btn primary" onclick="collectDemo()">Collect sample batch →</button></div>':view==='Publishing'?'<div class="notice">Choose destinations inside each story editor. Scheduled times use Dhaka time. All channel sends are simulated. <button class="btn" onclick="runDue()">Run due schedules (demo)</button></div>':view==='Published'?'<div class="notice">Delivery records below are examples. Open a story to edit a correction, or retry only a failed channel.</div>':''}<div class="summaryrow"><span><b>${stories.filter(s=>s.origin==='RSS'&&s.status==='Draft').length}</b>Incoming</span><span><b>${stories.filter(s=>s.origin==='Manual'&&s.status==='Draft').length}</b>Original drafts</span><span><b>${stories.filter(s=>['Queued','Scheduled'].includes(s.status)).length}</b>Awaiting publication</span><span><b>${stories.filter(s=>s.status==='Published').length}</b>Published in demo</span></div><section class="panel"><div class="panel-head"><h2>${view==='Incoming Stories'?'Story candidates':view==='Manual Writing'?'Your writing desk':view==='Published'?'Publication history':'Publishing queue'}</h2><span class="eyebrow">${rows.length} stories</span></div>${view==='Incoming Stories'?`<div class="feedbar">${['All feeds',...feeds.map(f=>f.name)].map(n=>`<button class="feedpill ${n===feedFilter?'active':''}" data-feed="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}${view==='Publishing'?`<div class="tabs">${['All','Queued','Scheduled'].map(s=>`<button data-status="${s}" class="${s===statusFilter?'active':''}">${s}</button>`).join('')}</div>`:''}<div class="table-wrap"><table><thead><tr><th>STORY</th><th>CATEGORY & TAGS</th><th>USERS</th><th>${view==='Published'?'DELIVERY':'STATUS'}</th><th>ACTIONS</th></tr></thead><tbody>${rows.map(s=>`<tr><td><strong>${esc(s.title)}</strong><small>${esc(s.type)} · ${esc(s.feed||'Original reporting')}</small></td><td><span class="tag blue">${esc(s.category||'Unassigned')}</span><div class="chiprow">${s.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')||'<small>No tags yet</small>'}</div></td><td><small>${esc(s.users.join(', ')||'Unassigned')}</small></td><td><span class="tag ${s.status==='Published'?'green':s.status==='Queued'?'blue':'amber'}">${s.status}</span>${s.channels?.length?`<div class="chiprow">${s.channels.map((c,i)=>`<span class="chip" style="${s.delivery?.[c]==='Failed (demo)'?'background:#fdeae9;color:#b65351':''}">${esc(c)} · ${esc(s.delivery?.[c]||'Not sent')}${s.delivery?.[c]==='Failed (demo)'?` <button style="border:0;background:transparent;color:inherit;font-size:10px;text-decoration:underline" onclick="retryChannel(${s.id},${i})">Retry</button>`:''}</span>`).join('')}</div>`:''}${s.status==='Scheduled'&&s.scheduled?`<small>${esc(s.scheduled.replace('T',' '))} Dhaka</small>`:''}</td><td><button class="btn" onclick="edit(${s.id})">${view==='Published'?'Edit correction':'Edit'} →</button>${view==='Incoming Stories'?`<button class="btn" style="margin-top:6px" onclick="discard(${s.id})">Discard</button>`:view==='Published'?`<button class="btn" style="margin-top:6px" onclick="viewPost(${s.id})">View post</button>`:''}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">No stories in this view.</div>'}</div><div class="foot"><span>Open any story in the full-page editor.</span><span>${rows.length} stories</span></div></section>`;
document.querySelectorAll('[data-feed]').forEach(b=>b.onclick=()=>{feedFilter=b.dataset.feed;render()});document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{statusFilter=b.dataset.status;render()})}
function addFeed(){const name=prompt('Source name (RSS feed or permitted website)');if(!name?.trim())return;const url=prompt('Source URL (https://…)');if(!url)return;try{const u=new URL(url);if(u.protocol!=='https:'&&u.protocol!=='http:')throw Error()}catch{toast('Enter a valid HTTP or HTTPS feed URL.');return}const kind=prompt('Source type: RSS or Website','RSS');feeds.push({name:name.trim(),url,kind:kind==='Website'?'Website':'RSS'});persist();render();toast('Feed configuration saved — live fetching is not connected.')}
function edit(id){returnFocus=document.activeElement;draft=JSON.parse(JSON.stringify(stories.find(s=>s.id===id)));if(view==='Published')draft.scheduled='';open()}
function newStory(){returnFocus=document.activeElement;draft={id:Date.now(),title:'',category:'',tags:[],users:[],type:'Article',origin:'Manual',status:'Draft',body:'',summary:'',source:'',image:'',alt:'',caption:''};open()}
function open(){previewing=false;draw();$('modal').hidden=false;document.body.classList.add('bodylocked');$('drawer').querySelector('button').focus()}
function field(id,label,val,placeholder=''){return `<label class="field"><span>${label}</span><input id="${id}" value="${esc(val)}" placeholder="${esc(placeholder)}"></label>`}
function draw(){const s=draft;$('drawer').innerHTML=`<div class="editor-top"><div><div class="eyebrow" style="margin-bottom:5px">${s.origin==='RSS'?'RSS story':'Original story'} · ${s.status}</div><h2 id="editheading">Story editor</h2></div><div class="actions" style="margin:0"><button class="btn" onclick="togglePreview()">${previewing?'Back to editor':'Preview'}</button><button class="close" onclick="closeEditor()" aria-label="Close editor">✕</button></div></div><div class="editor-body"><div class="writing">${previewing?`<article class="preview">${s.image?`<img src="${s.image}" alt="${esc(s.alt)}"><p style="font-size:11px">${esc(s.caption)}</p>`:''}<div class="chiprow"><span class="tag blue">${esc(s.category)}</span>${s.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><h2>${esc(s.title||'Untitled story')}</h2><p>${esc(s.summary)}</p><div style="margin-top:20px">${esc(s.body)}</div><p style="font-size:11px;margin-top:20px">By ${esc(s.users.join(', '))} · ${esc(s.type)}</p></article>`:`<label class="field"><span>HEADLINE</span><input id="headline" class="headline" placeholder="Write your headline…" value="${esc(s.title)}"></label><label class="field"><span>SUMMARY / DECK</span><textarea id="summary" style="min-height:80px" placeholder="A short introduction…">${esc(s.summary)}</textarea></label><div class="imagebox">${s.image?`<img src="${s.image}" alt="${esc(s.alt)}"><button class="btn" onclick="removeImage()">Remove image</button>`:'<p style="margin-bottom:14px">Add a cover image to your article or news bite</p>'}<label class="btn" style="cursor:pointer"><span>+ Upload image</span><input id="upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none" onchange="uploadImage(this)"></label><small style="display:block;color:#8795a0;margin-top:10px">JPG, PNG, WebP or GIF · up to 3 MB</small></div>${field('alt','IMAGE ALT TEXT',s.alt,'Describe the image for readers')}${field('caption','IMAGE CAPTION / CREDIT',s.caption,'Caption and image credit')}<label class="field"><span>STORY CONTENT</span><textarea class="bodytext" id="body" placeholder="Start writing your story…">${esc(s.body)}</textarea></label>`}</div><aside class="metadata"><label class="field"><span>FORMAT</span><select id="type">${['Article','News bite'].map(t=>`<option ${s.type===t?'selected':''}>${t}</option>`).join('')}</select></label>${field('category','CATEGORY *',s.category,'e.g. Business, Tech, Dhaka Now')}${field('tags','TAGS *',s.tags.join(', '),'e.g. Metro, Transport')}<p style="font-size:11px;margin-top:-10px;margin-bottom:20px">Separate tags with commas.</p>${field('users','USERS *',s.users.join(', '),'e.g. Sam, Nadia')}<p style="font-size:11px;margin-top:-10px;margin-bottom:20px">Assign authors or contributors, separated by commas.</p>${field('source','SOURCE / REPORTING NOTES',s.source,'Source URL or reporting notes')}${distributionFields(s)}<div class="notice">Every article and news bite requires a category, at least one tag, and an assigned user before it enters publishing.</div><p style="font-size:11px">Publishing is simulated in this sample.</p></aside></div><div class="editor-bottom"><p id="savehint">Save your draft or send it to the publishing queue.</p><div class="actions" style="margin:0">${view!=='Published'?'<button class="btn" onclick="save(\'Draft\')">Save draft</button>':''}<button class="btn primary" onclick="save('${['Publishing','Published'].includes(view)?'Published':'Queued'}')">${view==='Published'?'Save correction (demo)':view==='Publishing'?'Publish / schedule (demo)':'Send to publishing'} →</button></div></div>`}
const csv=v=>[...new Set(v.split(',').map(t=>t.trim()).filter(Boolean))];
function capture(){if(!previewing){Object.assign(draft,{title:$('headline').value.trim(),summary:$('summary').value.trim(),body:$('body').value,alt:$('alt').value.trim(),caption:$('caption').value.trim()})}Object.assign(draft,{type:$('type').value,category:$('category').value.trim(),tags:csv($('tags').value),users:csv($('users').value),source:$('source').value.trim(),channels:CHANNELS.filter((c,i)=>$('channel'+i).checked),scheduled:$('schedule').value,social:$('social').value.trim()})}
function togglePreview(){capture();previewing=!previewing;draw()}
function removeImage(){capture();draft.image='';draw()}
function uploadImage(input){const f=input.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(f.type)||f.size>3*1024*1024){toast('Choose a supported image smaller than 3 MB.');return}capture();const target=draft;const r=new FileReader();r.onload=()=>{if(draft!==target||$('modal').hidden)return;target.image=r.result;draw();toast('Image added to your draft')};r.onerror=()=>toast('Image could not be read.');r.readAsDataURL(f)}
function save(status){capture();if(!draft.title){$('savehint').textContent='Add a headline before saving.';$('savehint').className='error';return}if(status!=='Draft'&&(!draft.category||!draft.tags.length||!draft.users.length||!draft.body.trim())){$('savehint').textContent='Add content, category, tags, and users before publishing.';$('savehint').className='error';return}if(status==='Published'){if(!draft.channels.length){$('savehint').textContent='Choose at least one publishing destination.';return}if(draft.channels.includes('Instagram')&&!draft.image){$('savehint').textContent='Add an image for this Instagram feed post.';return}if(draft.scheduled){const t=Date.parse(draft.scheduled+'+06:00');if(!Number.isFinite(t)||t<=Date.now()){$('savehint').textContent='Choose a future time in Dhaka or clear the schedule.';return}status='Scheduled'}}draft.status=status;if(status==='Published')draft.updatedAt=new Date().toISOString();if(status==='Published')draft.delivery=Object.fromEntries(draft.channels.map(c=>[c,'Published (demo)']));if(status==='Scheduled')draft.delivery=Object.fromEntries(draft.channels.map(c=>[c,'Scheduled (demo)']));const i=stories.findIndex(s=>s.id===draft.id);if(i>=0)stories[i]=JSON.parse(JSON.stringify(draft));else stories.unshift(JSON.parse(JSON.stringify(draft)));const stored=persist();if(status==='Queued'||status==='Scheduled'){view='Publishing';statusFilter='All'}else if(status==='Published'){view='Published';statusFilter='All'}closeEditor(true);if(stored)toast(status==='Scheduled'?'Schedule saved in demo — no background publisher connected.':status==='Published'?'Publication simulated — nothing posted externally.':status==='Queued'?'Story added to publishing queue.':'Draft saved.')}
function closeEditor(force=false){if(!$('modal').hidden&&!force){capture();const original=stories.find(s=>s.id===draft.id);if(JSON.stringify(draft)!==JSON.stringify(original)&&!confirm('Discard unsaved changes?'))return}$('modal').hidden=true;document.body.classList.remove('bodylocked');render();if(returnFocus?.isConnected)returnFocus.focus();else $('new').focus()}

const CHANNELS=['WordPress','Facebook','Instagram','LinkedIn','X'];
function distributionFields(s){return `<h3>Publishing destinations</h3><div>${CHANNELS.map((c,i)=>`<label style="display:flex;margin:9px 0"><input style="width:auto" id="channel${i}" type="checkbox" ${(s.channels||['WordPress']).includes(c)?'checked':''}>${c}</label>`).join('')}</div><label class="field" style="margin-top:20px"><span>SOCIAL CAPTION</span><textarea id="social" style="min-height:100px">${esc(s.social||s.summary||'')}</textarea><small>Edit the caption for social channels. WordPress receives the full story.</small></label><label class="field"><span>SCHEDULE · DHAKA TIME</span><input id="schedule" type="datetime-local" value="${esc(s.scheduled||'')}"><small>Leave empty to publish immediately. Scheduling is simulated.</small></label>`}
function collectionPanel(){return `<section class="panel" style="margin-bottom:22px"><div class="panel-head"><h2>Automatic story collection</h2><span class="tag amber">Backend not connected</span></div><div style="padding:20px 22px"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px"><label class="field"><span>STORIES PER BATCH</span><select id="batch">${[20,30,40,50].map(n=>`<option ${collection.limit===n?'selected':''}>${n}</option>`).join('')}</select></label><label class="field"><span>COLLECT EVERY</span><select id="interval">${['15 minutes','30 minutes','1 hour','6 hours','Daily'].map(n=>`<option ${collection.interval===n?'selected':''}>${n}</option>`).join('')}</select></label><label class="field"><span>DRAFT LANGUAGE</span><select id="language">${['English','Bangla'].map(n=>`<option ${collection.language===n?'selected':''}>${n}</option>`).join('')}</select></label><label class="field"><span>COLLECTION SOURCES</span><select id="mode">${['RSS + permitted websites','RSS only'].map(n=>`<option ${collection.mode===n?'selected':''}>${n}</option>`).join('')}</select></label></div>${field('topics','PREFERRED CATEGORIES (OPTIONAL)',collection.topics||'','e.g. Business, Tech, Dhaka Now')}<div style="display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap"><div><label><input id="auto" type="checkbox" ${collection.auto?'checked':''}>Collect automatically (configuration only)</label><p style="font-size:11px">Source collection → remove duplicates → AI draft → edit → publishing</p></div><div class="actions" style="margin:0"><button class="btn" onclick="saveCollection()">Save settings</button><button class="btn primary" onclick="collectDemo()">Generate sample batch →</button></div></div><p style="font-size:11px;margin-top:15px">A live run should return up to the selected number of fresh, distinct stories. It should not pad the list when fewer stories qualify.</p></div></section>`}
function saveCollection(silent=false){if(!$('batch')||view!=='Sources')return;collection={limit:+$('batch').value,interval:$('interval').value,language:$('language').value,mode:$('mode').value,auto:$('auto').checked,topics:$('topics').value.trim()};persist();if(!silent)toast('Collection settings saved — backend required to run automatically.')}
const TOPICS=[['City updates','Dhaka Now',['Transport','Metro'],['Metro operator shares a maintenance notice','City bus service announces a route update','Road closure notice outlines a diversion','Railway timetable update lists service changes','Traffic desk reports a cleared intersection','Water utility publishes a service notice','Power utility lists planned maintenance','City park announces revised opening hours','Community library opens weekend registration','Local venue shares a public event schedule']],['Business wire','Business',['Business','Economy'],['Company announces a new distribution center','Local startup introduces a business service','Industry association releases a market note','Exporters announce a trade event','Small business workshop opens registration','Bank shares a customer service update','Retail company announces a new outlet','Chamber schedules an entrepreneurship forum','Local manufacturer announces equipment upgrades','Business association introduces a training program']],['Technology digest','Tech',['Technology','Innovation'],['Software company previews a new product','University schedules a technology seminar','Developer community announces a coding meetup','Telecom provider shares a network update','Research team demonstrates a prototype','Cybersecurity workshop opens registration','Technology expo publishes its exhibitor list','Digital services team updates its public portal','Startup incubator announces a demo day','Student robotics club shares an event notice']],['City updates','Bangladesh',['Bangladesh','Community'],['University publishes an admissions notice','Public library launches a reading program','Community group announces a volunteer drive','Municipal office publishes a public notice','Education conference opens registration','Local sports venue updates its schedule','Cultural center announces an exhibition','Agriculture fair releases a program outline','Museum shares a visitor information update','Training institute announces new course dates']],['Business wire','Diaspora',['Diaspora','Community'],['Student association shares an orientation guide','Diaspora group schedules a community meetup','Alumni network announces a mentoring program','Cultural association publishes an event calendar','Professional network opens workshop registration','Bangladeshi artists announce a group exhibition','Community center offers a language workshop','Overseas student group launches a welcome program','Diaspora business forum shares its agenda','Volunteer network announces an information session']]];
function collectDemo(){saveCollection(true);let pool=TOPICS.flatMap(([feed,category,tags,titles])=>titles.map((title,i)=>({key:feed+category+i,feed,category,tags,title})));const preferred=csv(collection.topics||'').map(t=>t.toLowerCase());let available=pool.filter(t=>feeds.some(f=>f.name===t.feed&&f.enabled!==false)&&(!preferred.length||preferred.includes(t.category.toLowerCase()))&&!stories.some(s=>s.demoKey===t.key));let chosen=available.slice(0,collection.limit);const bn=collection.language==='Bangla';const now=Date.now();stories.unshift(...chosen.map((t,i)=>({id:now+i,demoKey:t.key,title:bn?'নমুনা সংবাদ: '+t.title:'[Sample] '+t.title,category:t.category,tags:[...t.tags],users:[],type:'News bite',origin:'RSS',feed:t.feed,status:'Draft',body:bn?'এটি একটি কাল্পনিক নমুনা খসড়া। বাস্তব সংবাদ সংগ্রহ বা AI কল করা হয়নি। প্রকাশের আগে প্রকৃত সূত্র ও তথ্য যোগ করুন।':'This fictional sample represents a collected story candidate. No live website was scraped and no AI call was made. Add the actual source details and edit the reporting before publishing.',summary:bn?'সম্পাদনার জন্য কাল্পনিক নমুনা।':'Fictional candidate for editorial review.',source:'Fictional source record — no live URL',image:'',alt:'',caption:'',channels:['WordPress'],social:'',scheduled:''})));persist();view='Incoming Stories';feedFilter='All feeds';statusFilter='All';render();toast(chosen.length?`${chosen.length} fictional drafts added; repeated demo events excluded.`:'No fresh sample stories match your enabled sources and categories.')}
function runDue(){let count=0;stories.forEach(s=>{if(s.status==='Scheduled'&&Date.parse(s.scheduled+'+06:00')<=Date.now()){s.status='Published';s.delivery=Object.fromEntries((s.channels||[]).map(c=>[c,'Published (demo)']));count++}});persist();render();toast(count?`${count} scheduled stories published in demo only.`:'No scheduled stories are due. No external publication made.')}


function renderSources(){const q=$('search').value.toLowerCase();$('content').innerHTML=collectionPanel()+`<section class="panel"><div class="panel-head"><h2>News sources</h2><button class="btn primary" onclick="addFeed()">+ Add source</button></div><div class="table-wrap"><table><thead><tr><th>SOURCE</th><th>TYPE</th><th>ADDRESS</th><th>ENABLED</th><th></th></tr></thead><tbody>${feeds.map((f,i)=>({f,i})).filter(({f})=>(f.name+' '+f.url).toLowerCase().includes(q)).map(({f,i})=>`<tr><td><strong>${esc(f.name)}</strong></td><td><span class="tag blue">${esc(f.kind||'RSS')}</span></td><td><small>${esc(f.url||'Fictional sample feed')}</small></td><td><label><input type="checkbox" ${f.enabled!==false?'checked':''} onchange="toggleSource(${i},this.checked)">Collect</label></td><td><button class="btn" onclick="removeSource(${i})">Remove</button></td></tr>`).join('')}</tbody></table></div><div class="foot">Sample collection uses the three built-in feeds. Custom sources require the live backend.</div></section>`}
function toggleSource(i,v){feeds[i].enabled=v;persist();toast(v?'Source enabled':'Source paused')}
function removeSource(i){if(!confirm('Remove this source configuration? Existing stories will remain.'))return;feeds.splice(i,1);persist();render()}
function discard(id){if(!confirm('Discard this candidate from the editing list?'))return;const s=stories.find(s=>s.id===id);s.status='Discarded';persist();render();toast('Candidate discarded')}
function retryChannel(id,index){const s=stories.find(s=>s.id===id),c=s.channels[index];s.delivery[c]='Published (demo)';persist();render();toast(c+' retry simulated — no external post made.')}
function viewPost(id){toast('This is a demo publication. Live integrations will return the actual post links.')}
function renderConnections(){const services=[...CHANNELS,'OpenAI API'];const q=$('search').value.toLowerCase();$('content').innerHTML=`<div class="notice">Connection setup preview. No service is authenticated and no credentials are collected in this HTML file.</div><div class="mini">${services.filter(n=>n.toLowerCase().includes(q)).map(n=>{const c=connections[n];return `<section class="panel"><span class="tag ${c?'blue':'amber'}">${c?'Configured · not connected':'Not connected'}</span><h3 style="margin-top:18px">${n}</h3><p style="min-height:65px">${n==='WordPress'?'Connect the news website to publish articles, images, categories, and tags.':n==='OpenAI API'?'Use the backend to draft news bites, suggest tags, and prepare social captions.':'Authorize the company account to publish and track channel delivery.'}</p>${c?`<p style="font-size:11px;margin:12px 0">${esc(c.label)}<br>${esc(c.url||'')}</p>`:''}<button class="btn primary" style="margin-top:15px" data-config="${n}">${c?'Edit configuration':'Configure'}</button>${c?`<button class="btn" style="margin-top:10px" data-clear="${n}">Clear</button>`:''}</section>`}).join('')}</div>`;document.querySelectorAll('[data-config]').forEach(b=>b.onclick=()=>configureConnection(b.dataset.config));document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{delete connections[b.dataset.clear];persist();render()})}
function configureConnection(service){const label=prompt(service==='OpenAI API'?'AI integration label (do not enter an API key)':'Website or company account name',connections[service]?.label||'');if(!label?.trim())return;let url='';if(service==='WordPress'){url=prompt('WordPress website URL',connections[service]?.url||'https://');if(!url)return;try{if(new URL(url).protocol!=='https:')throw Error()}catch{toast('Enter a valid HTTPS website URL.');return}}connections[service]={label:label.trim(),url};persist();render();toast('Configuration saved. Authentication requires the backend.')}
if(!stories.some(s=>s.id===7001)){stories.push({id:7001,title:'[Sample] Community technology event recap',category:'Tech',tags:['Events','Community'],users:['Sam'],type:'News bite',origin:'Manual',status:'Published',body:'This fictional publication demonstrates delivery history and the corrections workflow.',summary:'A sample event recap.',source:'Fictional newsroom reporting',image:'',caption:'',alt:'',channels:['WordPress','Facebook'],delivery:{WordPress:'Published (demo)',Facebook:'Failed (demo)'},social:'Sample event recap.',scheduled:''})}

$('search').oninput=render;$('new').onclick=newStory;document.addEventListener('keydown',e=>{if($('modal').hidden)return;if(e.key==='Escape'){e.preventDefault();closeEditor()}if(e.key==='Tab'){const list=[...$('drawer').querySelectorAll('button,input:not([type=file]),textarea,select')];const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
</script></body></html>
